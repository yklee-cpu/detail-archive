<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상세페이지 아카이브</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: two text nav rows (category, then section type) over a card grid; click a card for the full frame. */
:root{
  --bg:#ffffff; --soft:#f5f5f5; --ink:#111111; --muted:#9a9a9a; --line:#e5e5e5;
  --accent:#00AC89; --chip:#111111; --chip-ink:#ffffff;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-top:3px solid var(--ink);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:0 24px}
.row1{display:flex;align-items:center;gap:48px;height:72px}
.logo{color:inherit;text-decoration:none;cursor:pointer;font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1;white-space:nowrap}
nav{display:flex;gap:28px;flex-wrap:wrap}
.cat{font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.02em;padding:6px 0}
.cat:hover{color:var(--ink)}
.cat[aria-pressed="true"]{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
.row2{display:flex;flex-wrap:wrap;gap:8px 22px;padding:12px 0 14px;border-top:1px solid var(--line)}
.row2::-webkit-scrollbar{display:none}
.type{font-size:13px;color:var(--muted);white-space:nowrap;padding:2px 0}
.type:hover{color:var(--ink)}
.type[aria-pressed="true"]{color:var(--accent);font-weight:700}
.type .n{font-size:11px;margin-left:3px;opacity:.7}
main{max-width:1280px;margin:0 auto;padding:24px 24px 64px}
.desc{margin:0 0 20px;font-size:13px;color:#555}
.desc b{color:var(--ink);font-weight:700;margin-right:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:28px 18px}
.card{display:flex;flex-direction:column;gap:10px;text-align:left}
.thumb{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--soft);border:1px solid var(--line);border-radius:8px}
.thumb img{width:100%;display:block}
.thumb.short{display:flex;align-items:center}
.sp{width:100%;overflow:hidden;flex:none}
.sp img{width:100%;height:auto;display:block}
.pthumb{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;background:#fff}
.pthumb img{width:100%;height:100%;object-fit:contain}
.type.vtag{border-left:1px solid #ddd;padding-left:14px}
.thumb .gif{position:absolute;top:6px;left:6px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;font-size:9px;font-weight:700;letter-spacing:.04em;line-height:14px;pointer-events:none}
.card:hover .thumb{border-color:var(--ink)}
.chip{align-self:flex-start;font-size:13px;font-weight:600;padding:0;letter-spacing:.01em;background:none;color:var(--ink);line-height:1.35}
.t{font-weight:400;font-size:12px;line-height:1.4;color:var(--ink);text-wrap:balance;margin-top:-6px}
.empty{padding:80px 0;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(10,10,12,.75);z-index:20;display:none;justify-content:center}
.modal.open{display:flex}
.sheet{display:flex;width:min(880px,100%);height:100%;background:var(--bg)}
.viewer{position:relative;flex:1;overflow-y:auto;background:#fff;min-width:0}
.viewer img{width:100%;height:auto;display:block}
.viewer .pk{overflow:hidden;width:100%}
.viewer .pk img{max-width:none}
.side{width:260px;padding:20px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line)}
.side h2{margin:0;font-size:17px;line-height:1.35;text-wrap:balance}
.side .src{font-size:12px;color:var(--muted)}
.side .src a{color:var(--ink)}
.nav{display:flex;gap:6px;margin-top:4px}
.nav button{flex:1;border:1px solid var(--line);border-radius:6px;padding:8px 0;font-size:13px;background:var(--soft)}
.nav button:disabled{opacity:.35;cursor:default}
.close{align-self:flex-end;font-size:13px;color:var(--muted)}
.cat.bp{border-left:1px solid #ddd;padding-left:14px;margin-left:-14px}

.blist{display:flex;flex-direction:column;gap:28px}
.bgrp h3{margin:0 0 10px;font-size:13px;color:var(--accent);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px}
.brow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid #f0f0f0}
.brow:hover .bn{text-decoration:underline;text-underline-offset:4px}
.bth{width:56px;height:56px;flex:none;overflow:hidden;border:1px solid var(--line);border-radius:6px;background:var(--soft)}
.bth img{width:100%;display:block}
.bn{font-size:14px;font-weight:500}
.bn b{font-weight:700;margin-right:6px}
.bm{font-size:12px;color:var(--muted);margin-left:auto;white-space:nowrap}
.side .toc{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -6px;font-size:12px}
.side .toc button{text-align:left;padding:4px 6px;border-radius:4px;line-height:1.35}
.side .toc button:hover{background:var(--soft)}
.side .toc .ty{color:var(--muted);display:block;font-size:11px}
.viewer .secmark{height:0}
.acts{display:flex;gap:6px}
.acts button{flex:1;border:1px solid var(--line);border-radius:6px;padding:8px 0;font-size:13px;background:#fff;display:flex;align-items:center;justify-content:center;gap:4px}
.acts button:hover{border-color:var(--ink)}
.acts .en{flex:0 0 40px;height:36px;padding:0;background:#fff;color:#b0b0b0}
.acts .en:hover{color:#e0a800;border-color:#e0b400}
.acts .en[aria-pressed="true"]{background:#ffd60a;border-color:#ffd60a;color:#111}
.acts .en svg{width:18px;height:18px}
.enbar{display:flex;align-items:center;gap:10px;color:#7a5a00}
.enbar button{border:1px solid #e0b400;background:#ffd60a;color:#111;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111;color:#fff;font-size:13px;padding:8px 14px;border-radius:8px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

@media (max-width:700px){
  .bar,main{padding-left:16px;padding-right:16px}
  .row1{gap:20px;height:56px}
  nav{gap:18px}
  .cat.bp{margin-left:-6px;padding-left:12px}
  .grid{grid-template-columns:repeat(2,1fr);gap:20px 12px}
  .sheet{flex-direction:column}
  .side{width:auto;border-left:0;border-top:1px solid var(--line);padding:14px 16px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="row1"><a class="logo" id="home" href="#" title="처음 화면으로">Archive</a><nav id="cats" aria-label="카테고리"></nav></div>
    <div class="row2" id="types" role="group" aria-label="섹션 유형"></div>
  </div>
</header>
<main id="main"></main>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="프레임 크게 보기 ">
  <div class="sheet"><div class="viewer" id="viewer"></div><div class="side" id="side"></div></div>
</div>
<div class="toast" id="toast"></div>
<script>
const TYPE_ORDER=["공식 판매처", "Hero", "셀럽·인플루언서", "B&A", "그래프", "Hook / Pain Point", "타겟 / 추천 대상", "제품 소개", "USP / Key Benefit", "기능·성분 상세", "인증·수치·임상", "비교", "후기·SNS", "Brand Story", "무드·화보", "정보성 콘텐츠", "How to Use / 사용법", "프로모션 / CTA", "가격 구성", "FAQ", "제품 정보·주의사항", "배송·교환·환불", "Undefined"];
const TYPE_DESC={"공식 판매처":"정품 인증, 공식 판매처 안내, 가품·유사품 주의 배너","Hero":"페이지에서 제품을 처음 보여주는 대표 키비주얼 (페이지당 1개, 할인 배너는 제외)","셀럽·인플루언서":"셀럽·인플루언서의 사용 장면이나 SNS 캡처 모음","B&A":"사용 전/후 비교 사진, 같은 장면의 시연 전후 (GIF 포함)","그래프":"막대·선 그래프가 중심인 데이터","Hook / Pain Point":"고객의 고민이나 불편을 질문·공감으로 꺼내는 도입부","타겟 / 추천 대상":"이런 분께 추천해요, 사용 대상을 짚어주는 구성","제품 소개":"제품명과 키비주얼이 중심인 제품 등장·라인업 소개","USP / Key Benefit":"핵심 효과·장점을 요약해서 나열","기능·성분 상세":"성분 하나, 기술 하나를 깊게 설명","인증·수치·임상":"인체적용시험, 인증서, 수상, 판매량 등 신뢰 근거","비교":"기존 제품이나 경쟁 제품과 나란히 비교","후기·SNS":"일반 소비자 후기, 리뷰, 사용 인증","Brand Story":"브랜드의 철학, 역사, 개발 이야기를 글로 풀어냄","무드·화보":"설명 없이 분위기를 만드는 화보·이미지 컷","정보성 콘텐츠":"제품 밖의 지식·원리를 알려주는 교육형 콘텐츠","How to Use / 사용법":"사용 방법, 순서, 루틴 안내","프로모션 / CTA":"할인, 증정, 기간 한정, 환불 보장, 이벤트 (위치 무관)","가격 구성":"세트·옵션별 가격표 카드","FAQ":"자주 묻는 질문","제품 정보·주의사항":"상품정보고시, 전성분, 주의사항","배송·교환·환불":"배송 일정, 교환·환불 안내","Undefined":"분류가 애매해서 확인을 기다리는 프레임"};
const st={cat:"전체",type:"전체"};
let pages=[],all=[],shown=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const VTAGS=["메커니즘·3D 렌더"];
TYPE_DESC["메커니즘·3D 렌더"]="피부·몸 속에서 일어나는 일을 3D CG로 보여주는 장면: 피부 단면·층, 세포·멜라닌·콜라겐 알갱이, 근육·림프 해부, 성분·패치·기기가 피부에 작용하는 장면 (제품 사진·실사 전후·그래프·표는 제외)";
const EN="에너지";
TYPE_DESC[EN]="에너지 있다고 고른 장면. 프레임을 열고 ⚡ 버튼으로 고르고, '목록 복사'를 Claude에게 보내면 사이트에 반영돼 모두에게 보여요";
const BOLT='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>';
let enOn=new Set(),enOff=new Set();
try{const v=JSON.parse(localStorage.getItem("archive_energy2")||"null");if(v){enOn=new Set(v.on);enOff=new Set(v.off)}}catch(e){}
let enOld=[];try{enOld=JSON.parse(localStorage.getItem("archive_energy")||"[]")}catch(e){}
const saveEnergy=()=>{try{localStorage.setItem("archive_energy2",JSON.stringify({on:[...enOn],off:[...enOff]}))}catch(e){}};
const fkey=s=>s.th?"th:"+s.th.id:s.page.id+"@"+s.y0;
const isEn=s=>{const k=fkey(s);return enOn.has(k)||(!!s.energy&&!enOff.has(k))};
function toggleEn(s){const k=fkey(s);const now=isEn(s);enOn.delete(k);enOff.delete(k);if(now){if(s.energy)enOff.add(k)}else{if(!s.energy)enOn.add(k)}saveEnergy();return !now}
const enPending=()=>all.filter(x=>{const k=fkey(x);return (enOn.has(k)&&!x.energy)||(enOff.has(k)&&x.energy)}).length;
async function copyEnergyList(){const keys=all.filter(isEn).map(fkey);const txt="ENERGY "+JSON.stringify(keys);
  try{await navigator.clipboard.writeText(txt);toast("목록을 복사했어요. Claude에게 붙여넣어 주세요")}catch(e){prompt("이 내용을 복사해서 Claude에게 보내주세요",txt)}}
let dirty=false;
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1600)}
function loadImg(u){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=u})}
async function frameCanvas(s){
  const W=s.pieces[0].w,H=s.pieces.reduce((a,x)=>a+x.h*W/x.w,0);
  const c=document.createElement("canvas");c.width=W;c.height=Math.round(H);const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);let y=0;
  for(const x of s.pieces){const im=await loadImg("img/"+(x.sheet||x.src));const h=x.h*W/x.w;
    if(x.sheet)g.drawImage(im,0,x.sy,x.w,x.h,0,y,W,h);else g.drawImage(im,0,0,im.naturalWidth,im.naturalHeight,0,y,W,h);y+=h}
  return c;
}
const fname=s=>(String(s.page.brand).replace(/\s*\(.*\)/,"")+"_"+s.title).replace(/[\\/:*?"<>|·]/g," ").replace(/\s+/g,"_").slice(0,80);
async function copyFrame(s){try{const c=await frameCanvas(s);const b=await new Promise(r=>c.toBlob(r,"image/png"));await navigator.clipboard.write([new ClipboardItem({"image/png":b})]);toast("이미지를 복사했어요")}catch(e){toast("복사가 안 돼요. 저장을 이용해 주세요")}}
async function saveFrame(s){try{let blob,ext;
  if(s.pieces.length===1&&s.pieces[0].anim){blob=await (await fetch("img/"+s.pieces[0].src)).blob();ext="webp"}
  else{const c=await frameCanvas(s);blob=await new Promise(r=>c.toBlob(r,"image/png"));ext="png"}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname(s)+"."+ext;document.body.appendChild(a);a.click();a.remove();toast("저장했어요")}catch(e){toast("저장하지 못했어요")}}
const THUMB_TAGS=["식품","뷰티","비밀링크","블랙프라이데이"];
const THUMB_DESC={"식품":"식품·건강기능식품 상품 썸네일 (비밀링크·블프가 아닌 것)","뷰티":"뷰티 상품 썸네일 (비밀링크·블프가 아닌 것)","비밀링크":"상품 페이지나 썸네일에 '비밀링크' 표시가 있는 것. 블프와 겹치면 비밀링크 우선","블랙프라이데이":"썸네일 이미지에 '블프·블랙프라이데이'가 쓰인 것. 수집한 시점 그대로 보관"};
let thumbs=[];
Promise.all([fetch("data.json",{cache:"no-cache"}).then(r=>r.json()),fetch("thumbs.json",{cache:"no-cache"}).then(r=>r.ok?r.json():[]).catch(()=>[])]).then(([d,t])=>{
  pages=d; d.forEach(p=>p.sections.forEach((s,i)=>all.push({...s,page:p,idx:i})));
  if(enOld.length){enOld.forEach(k=>{const m=k.match(/^(.*):(\d+)$/);if(!m)return;const x=all.find(s=>s.page.id===m[1]&&s.idx===+m[2]);if(x&&!x.energy)enOn.add(fkey(x))});saveEnergy();try{localStorage.removeItem("archive_energy")}catch(e){}}
  thumbs=t.map(x=>({type:x.tags.join(" · "),title:x.title,tags:x.tags,pieces:[{src:x.src,w:x.w,h:x.h}],page:{brand:x.brand,category:"썸네일",url:x.url},th:x}));
  draw();
}).catch(()=>{$("main").innerHTML='<div class="empty">데이터를 불러오지 못했어요. 새로고침해 주세요.</div>'});
function draw(){
  const cats=["전체",...new Set(pages.map(p=>p.category)),"썸네일",BP];
  $("cats").innerHTML=cats.map(c=>`<button type="button" class="cat${c===BP?" bp":""}" aria-pressed="${st.cat===c}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  $("cats").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;st.type="전체";draw()});
  if(st.cat==="썸네일"){drawThumbs();return;}
  if(st.cat===BP){drawBrands();return;}
  const inCat=all.filter(s=>st.cat==="전체"||s.page.category===st.cat);
  const types=TYPE_ORDER.filter(t=>inCat.some(s=>s.type===t));
  $("types").innerHTML=[["전체",inCat.length],...types.map(t=>[t,inCat.filter(s=>s.type===t).length])]
    .map(([t,n])=>`<button type="button" class="type" aria-pressed="${st.type===t}" data-t="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`).join("")
    +VTAGS.map(t=>[t,inCat.filter(s=>(s.tags||[]).includes(t)).length]).filter(([t,n])=>n).map(([t,n])=>`<button type="button" class="type vtag" aria-pressed="${st.type===t}" data-t="${esc(t)}">#${esc(t)}<span class="n">${n}</span></button>`).join("")
    +`<button type="button" class="type vtag" aria-pressed="${st.type===EN}" data-t="${EN}">⚡${EN}<span class="n">${inCat.filter(isEn).length}</span></button>`;
  $("types").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.type=b.dataset.t;draw()});
  shown=inCat.filter(s=>st.type==="전체"||s.type===st.type||(s.tags||[]).includes(st.type)||(st.type===EN&&isEn(s)));
  if(!shown.length){$("main").innerHTML=(st.type!=="전체"&&TYPE_DESC[st.type]?`<p class="desc"><b>${esc(st.type)}</b>${esc(TYPE_DESC[st.type])}</p>`:"")+'<div class="empty">'+(st.type===EN?"아직 고른 장면이 없어요. 프레임을 열고 ⚡ 버튼을 눌러보세요.":"이 조건에 맞는 프레임이 아직 없어요.")+'</div>'+(st.type===EN&&enPending()?'<p class="desc enbar">사이트에 아직 반영 안 된 변경 '+enPending()+'개 <button type="button" id="encp">목록 복사</button></p>':'');if($("encp"))$("encp").onclick=copyEnergyList;return;}
  let dsc=st.type!=="전체"&&TYPE_DESC[st.type]?`<p class="desc"><b>${esc(st.type)}</b>${esc(TYPE_DESC[st.type])}</p>`:"";
  if(st.type===EN&&enPending())dsc+=`<p class="desc enbar">사이트에 아직 반영 안 된 변경 ${enPending()}개 <button type="button" id="encp">목록 복사</button></p>`;
  $("main").innerHTML=dsc+`<div class="grid">${shown.map((s,k)=>`<button type="button" class="card" data-k="${k}"><div class="thumb${(s.y1-s.y0)<1333?" short":""}"><div class="sp" style="aspect-ratio:${s.thumb.w}/${s.thumb.h}"><img decoding="async" onerror="retryImg(this)" width="${s.thumb.sw||""}" height="${s.thumb.sh||""}" src="img/${esc(s.thumb.s)}" style="margin-top:-${(s.thumb.y/s.thumb.w*100).toFixed(3)}%" alt=""></div>${s.pieces.some(x=>x.anim)?'<span class="gif">GIF</span>':''}</div><span class="chip">${esc(s.type)}</span><span class="t">${esc(s.title)}</span></button>`).join("")}</div>`;
  $("main").querySelectorAll(".card").forEach(b=>b.onclick=()=>open(+b.dataset.k));
  if($("encp"))$("encp").onclick=copyEnergyList;
}
function retryImg(i){const n=+(i.dataset.r||0);if(n>=4)return;i.dataset.r=n+1;const u=i.getAttribute("src").split("?")[0];setTimeout(()=>{i.src=u+"?r="+(n+1)},600*(n+1))}
function drawThumbs(){
  $("types").innerHTML=[["전체",thumbs.length],...THUMB_TAGS.map(t=>[t,thumbs.filter(x=>x.tags.includes(t)).length])]
    .map(([t,n])=>`<button type="button" class="type" aria-pressed="${st.type===t}" data-t="${esc(t)}">${esc(t)}<span class="n">${n}</span></button>`).join("");
  $("types").querySelectorAll("button").forEach(b=>b.onclick=()=>{st.type=b.dataset.t;draw()});
  shown=thumbs.filter(x=>st.type==="전체"||x.tags.includes(st.type));
  const dsc=THUMB_DESC[st.type]?`<p class="desc"><b>${esc(st.type)}</b>${esc(THUMB_DESC[st.type])}</p>`:"";
  if(!shown.length){$("main").innerHTML=dsc+'<div class="empty">이 분류에 모아둔 썸네일이 아직 없어요.</div>';return;}
  $("main").innerHTML=dsc+`<div class="grid">${shown.map((x,k)=>`<button type="button" class="card" data-k="${k}"><div class="thumb pthumb"><img decoding="async" onerror="retryImg(this)" src="img/${esc(x.th.src)}" width="${x.th.w}" height="${x.th.h}" alt=""></div><span class="chip">${esc(x.page.brand)}</span><span class="t">${esc(x.title)}</span></button>`).join("")}</div>`;
  $("main").querySelectorAll(".card").forEach(b=>b.onclick=()=>open(+b.dataset.k));
}
const BP="[브랜드] 제품";
const CHO="ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ";
const kname=b=>String(b).replace(/\s*\(.*\)\s*$/,"").trim();
const cho=t=>{const c=t.charCodeAt(0);if(c>=0xAC00&&c<=0xD7A3){const i=Math.floor((c-0xAC00)/588);return "ㄱㄱㄴㄷㄷㄹㅁㅂㅂㅅㅅㅇㅈㅈㅊㅋㅌㅍㅎ"[i]}return /[a-z]/i.test(t[0])?"A–Z":"#"};
let plist=[],mode="frame";
function drawBrands(){
  plist=[...pages].sort((a,b)=>kname(a.brand).localeCompare(kname(b.brand),"ko")||a.product.localeCompare(b.product,"ko"));
  $("types").innerHTML=`<span class="type">브랜드 가나다순 · 제품 ${plist.length}개</span>`;
  const groups=[];plist.forEach((p,k)=>{const g=cho(kname(p.brand));if(!groups.length||groups[groups.length-1][0]!==g)groups.push([g,[]]);groups[groups.length-1][1].push([p,k])});
  $("main").innerHTML=`<div class="blist">${groups.map(([g,ps])=>`<div class="bgrp"><h3>${esc(g)}</h3>${ps.map(([p,k])=>{const t=p.sections[0].thumb;return `<button type="button" class="brow" data-k="${k}"><span class="bth"><img decoding="async" onerror="retryImg(this)" src="img/${esc(t.s)}" style="margin-top:-${(t.y/t.w*100).toFixed(3)}%" alt=""></span><span class="bn"><b>[${esc(kname(p.brand))}]</b>${esc(p.product)}</span><span class="bm">${esc(p.category)} · ${p.sections.length}프레임</span></button>`}).join("")}</div>`).join("")}</div>`;
  $("main").querySelectorAll(".brow").forEach(b=>b.onclick=()=>openPage(+b.dataset.k));
}
const pieceHTML=x=>x.sheet?`<div class="pk" style="aspect-ratio:${x.w}/${x.h}"><img loading="lazy" onerror="retryImg(this)" src="img/${esc(x.sheet)}" width="${x.w}" height="${x.sh}" style="margin-top:-${(x.sy/x.w*100).toFixed(4)}%" alt=""></div>`:`<img loading="lazy" onerror="retryImg(this)" src="img/${esc(x.src)}" width="${x.w}" height="${x.h}" alt="">`;
function openPage(k){
  mode="page";cur=k;const p=plist[k];
  $("viewer").innerHTML=p.sections.map((s,i)=>`<div class="secmark" id="sec${i}"></div>`+s.pieces.map(pieceHTML).join("")).join("");$("viewer").scrollTop=0;
  $("side").innerHTML=`<button type="button" class="close" id="x">닫기 ✕</button><span class="chip">${esc(kname(p.brand))}</span><h2>${esc(p.product)}</h2>
  <div class="src">${esc(p.brand)} · ${esc(p.category)} · ${p.sections.length}프레임<br><a href="${esc(p.url)}" target="_blank" rel="noopener">원본 페이지 ↗</a></div>
  <div class="nav"><button type="button" id="pv" ${k===0?"disabled":""}>← 이전 제품</button><button type="button" id="nx" ${k===plist.length-1?"disabled":""}>다음 제품 →</button></div>
  <div class="toc">${p.sections.map((s,i)=>`<button type="button" data-i="${i}"><span class="ty">${i+1}. ${esc(s.type)}</span>${esc(s.title)}</button>`).join("")}</div>`;
  $("x").onclick=close;$("pv").onclick=()=>openPage(k-1);$("nx").onclick=()=>openPage(k+1);
  $("side").querySelectorAll(".toc button").forEach(b=>b.onclick=()=>{const m=$("sec"+b.dataset.i);$("viewer").scrollTop=m.offsetTop});
  $("modal").classList.add("open");
}
let cur=-1;
function open(k){
  mode="frame";cur=k; const s=shown[k];
  $("viewer").innerHTML=s.pieces.map(x=>x.sheet?`<div class="pk" style="aspect-ratio:${x.w}/${x.h}"><img onerror="retryImg(this)" src="img/${esc(x.sheet)}" width="${x.w}" height="${x.sh}" style="margin-top:-${(x.sy/x.w*100).toFixed(4)}%" alt=""></div>`:`<img onerror="retryImg(this)" src="img/${esc(x.src)}" width="${x.w}" height="${x.h}" alt="">`).join(""); $("viewer").scrollTop=0;
  $("side").innerHTML=`<button type="button" class="close" id="x">닫기 ✕</button><span class="chip">${esc(s.type)}</span><h2>${esc(s.title)}</h2>
  <div class="src">${esc(s.page.brand)} · ${esc(s.page.category)}<br><a href="${esc(s.page.url)}" target="_blank" rel="noopener">원본 페이지 ↗</a></div>
  <div class="nav"><button type="button" id="pv" ${k===0?"disabled":""}>← 이전</button><button type="button" id="nx" ${k===shown.length-1?"disabled":""}>다음 →</button></div>
  <div class="acts"><button type="button" id="cp">복사</button><button type="button" id="sv">저장</button><button type="button" class="en" id="en" aria-pressed="${isEn(s)}" title="에너지" aria-label="에너지">${BOLT}</button></div>`;
  $("x").onclick=close; $("pv").onclick=()=>open(k-1); $("nx").onclick=()=>open(k+1);
  $("cp").onclick=()=>copyFrame(s); $("sv").onclick=()=>saveFrame(s);
  $("en").onclick=()=>{const on=toggleEn(s);dirty=true;$("en").setAttribute("aria-pressed",on);toast(on?"⚡ 에너지에 담았어요":"에너지에서 뺐어요")};
  $("modal").classList.add("open");
}
$("home").onclick=e=>{e.preventDefault();close();st.cat="전체";st.type="전체";draw();window.scrollTo(0,0)};
function close(){$("modal").classList.remove("open");cur=-1;if(dirty){dirty=false;const y=window.scrollY;draw();window.scrollTo(0,y)}}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")close()});
document.addEventListener("keydown",e=>{if(cur<0)return;if(e.key==="Escape")close();const L=mode==="page"?plist:shown,f=mode==="page"?openPage:open;if(e.key==="ArrowRight"&&cur<L.length-1)f(cur+1);if(e.key==="ArrowLeft"&&cur>0)f(cur-1)});
</script>
</body>
</html>
